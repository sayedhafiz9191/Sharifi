<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance System - Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 id="welcome"></h2>
        <p class="text-muted mb-0">Manage your attendance below.</p>
      </div>
      <div>
        <a href="history.html" class="btn btn-outline-secondary me-2">View History</a>
        <button id="logout" class="btn btn-outline-danger">Logout</button>
      </div>
    </div>
    <div class="row g-4">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-body text-center">
            <h4>Check-In</h4>
            <p class="text-muted">Record today's check-in time.</p>
            <button id="checkInBtn" class="btn btn-success">Check-In</button>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-body text-center">
            <h4>Check-Out</h4>
            <p class="text-muted">Complete your workday.</p>
            <button id="checkOutBtn" class="btn btn-primary">Check-Out</button>
          </div>
        </div>
      </div>
    </div>
    <div id="message" class="alert mt-4 d-none"></div>
  </div>
  <script type="module">
    import { checkIn, checkOut, logout, requireAuth, getUserName } from './api.js';

    requireAuth();
    const welcome = document.getElementById('welcome');
    welcome.textContent = `Welcome, ${getUserName() || 'User'}`;

    const message = document.getElementById('message');

    const showMessage = (text, type = 'success') => {
      message.textContent = text;
      message.className = `alert alert-${type} mt-4`;
    };

    document.getElementById('checkInBtn').addEventListener('click', async () => {
      try {
        const response = await checkIn();
        showMessage(response.message, 'success');
      } catch (err) {
        showMessage(err.message, 'danger');
      }
    });

    document.getElementById('checkOutBtn').addEventListener('click', async () => {
      try {
        const response = await checkOut();
        showMessage(response.message, 'success');
      } catch (err) {
        showMessage(err.message, 'danger');
      }
    });

    document.getElementById('logout').addEventListener('click', async () => {
      await logout();
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
