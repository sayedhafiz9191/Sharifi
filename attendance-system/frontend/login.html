<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance System - Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm">
          <div class="card-body">
            <h3 class="text-center mb-4">Login</h3>
            <form id="loginForm">
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required />
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required />
              </div>
              <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <p class="mt-3 text-center">Don't have an account? <a href="register.html">Register</a></p>
            <div id="error" class="text-danger text-center mt-2"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module">
    import { login, storeUserName } from './api.js';

    const form = document.getElementById('loginForm');
    const error = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.textContent = '';
      try {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const response = await login(email, password);
        storeUserName(response.user?.name || email);
        window.location.href = 'dashboard.html';
      } catch (err) {
        error.textContent = err.message;
      }
    });
  </script>
</body>
</html>
