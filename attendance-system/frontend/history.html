<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance System - History</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2>Attendance History</h2>
        <p class="text-muted mb-0">Complete list of your daily records.</p>
      </div>
      <div>
        <a href="dashboard.html" class="btn btn-outline-secondary">Back to Dashboard</a>
      </div>
    </div>
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-striped" id="historyTable">
            <thead>
              <tr>
                <th>Date</th>
                <th>Check-In</th>
                <th>Check-Out</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script type="module">
    import { getHistory, requireAuth } from './api.js';

    requireAuth();

    const tbody = document.querySelector('#historyTable tbody');

    const renderRow = (record) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${record.date}</td>
        <td>${record.check_in ?? '-'}</td>
        <td>${record.check_out ?? '-'}</td>
      `;
      return tr;
    };

    const loadHistory = async () => {
      try {
        const response = await getHistory();
        tbody.innerHTML = '';
        response.data.forEach((record) => tbody.appendChild(renderRow(record)));
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="3" class="text-danger">${err.message}</td></tr>`;
      }
    };

    loadHistory();
  </script>
</body>
</html>
